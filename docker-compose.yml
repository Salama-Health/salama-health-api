# Production-ish stack for a single AWS EC2 instance:
#   db (PostgreSQL)  ->  api (Gunicorn/Uvicorn)  ->  nginx (TLS/reverse proxy)
#
#   docker compose up -d --build
#   docker compose exec api python -m scripts.seed
#
# Models are mounted read-only from ./models into the container.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salama}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salama}
      POSTGRES_DB: ${POSTGRES_DB:-salama}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-salama}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Tune for many concurrent connections from multiple API workers
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Inject the whole .env into the container, then override the few values
    # that must differ inside compose (DB host is `db`, models path, etc.).
    # `environment` takes precedence over `env_file`.
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-salama}:${POSTGRES_PASSWORD:-salama}@db:5432/${POSTGRES_DB:-salama}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      MODELS_DIR: /app/models
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-true}
      HF_MODEL_REPO: ${HF_MODEL_REPO:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      - ./models:/app/models:ro
    expose:
      - "8000"
    # For direct access without nginx, swap `expose` for:
    # ports:
    #   - "8000:8000"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro

volumes:
  pgdata:
