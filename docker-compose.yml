# Production-ish stack for a single AWS EC2 instance:
#   db (PostgreSQL)  ->  api (Gunicorn/Uvicorn)  ->  nginx (TLS/reverse proxy)
#
#   docker compose up -d --build
#   docker compose exec api python -m scripts.seed
#
# Models are mounted read-only from ./models into the container.
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-salama}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-salama}
      POSTGRES_DB: ${POSTGRES_DB:-salama}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-salama}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Tune for many concurrent connections from multiple API workers
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Inject the whole .env into the container, then override the few values
    # that must differ inside compose (DB host is `db`, models path, etc.).
    # `environment` takes precedence over `env_file`.
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-salama}:${POSTGRES_PASSWORD:-salama}@db:5432/${POSTGRES_DB:-salama}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      MODELS_DIR: /app/models
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-true}
      # NOTE: HF_MODEL_REPO is deliberately NOT overridden here. An
      # `environment` entry beats env_file, so `${HF_MODEL_REPO:-}`
      # pushed an empty string whenever the host .env omitted the key,
      # silently disabling the Hugging Face fallback. Let .env (or the
      # default in app/config.py) supply it.
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
    volumes:
      - ./models:/app/models:ro
      # GEE service-account key (only needed for automated SAR). Put the JSON at
      # ./secrets/gee-key.json on the host and set GEE_* in .env.
      - ./secrets:/app/secrets:ro
    expose:
      - "8000"
    # For direct access without nginx, swap `expose` for:
    # ports:
    #   - "8000:8000"

  # Caddy terminates TLS and proxies to the API. It obtains and renews the
  # Let's Encrypt certificate itself over ACME HTTP-01 on port 80, so port 80
  # must stay open in the security group even once HTTPS works.
  #
  # Replaced nginx, which needed certbot plus a renewal cron. The one thing
  # lost in the swap is nginx's per-IP rate limit (20 r/s); Caddy needs a
  # plugin build for that, so it is not in place right now.
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates and ACME account keys. A named volume, not a bind mount,
      # so the rsync deploy (--delete) can never wipe them.
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
