# Reverse proxy in front of the API workers.
# Handles TLS termination, rate limiting and connection buffering so the
# Python workers only do app work.

# Basic per-IP rate limit (tune to your traffic).
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

upstream salama_api {
    server api:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Redirect to HTTPS once certs are in place (uncomment after TLS setup):
    # return 301 https://$host$request_uri;

    client_max_body_size 10m;

    # ACME HTTP-01 challenge. Let's Encrypt fetches a token from here over
    # plain HTTP, on issuance AND on every 90-day renewal - so port 80 must
    # stay open and this location must stay above any HTTPS redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        access_log off;
    }

    location /health {
        proxy_pass http://salama_api/health;
        access_log off;
    }

    location / {
        limit_req zone=api_limit burst=40 nodelay;

        proxy_pass http://salama_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

