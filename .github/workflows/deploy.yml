name: Deploy to EC2

# Deploys on every push to main, or manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; cancel an in progress one if a newer push lands.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            echo "Fetching latest code"
            git fetch --all
            git reset --hard origin/main
            echo "Rebuilding and restarting containers"
            docker compose up -d --build
            echo "Applying database migrations"
            docker compose exec -T api alembic upgrade head || echo "No migrations to apply"
            echo "Cleaning up old images"
            docker image prune -f

      - name: Health check
        run: |
          echo "Waiting for the API to report healthy"
          for i in $(seq 1 20); do
            if curl -fsS "http://${{ secrets.EC2_HOST }}/health" > /dev/null; then
              echo "API is healthy"
              exit 0
            fi
            echo "Attempt $i not ready yet, retrying in 6s"
            sleep 6
          done
          echo "API did not become healthy in time"
          exit 1
