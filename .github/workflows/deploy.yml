name: Deploy to EC2

# Deploys on every push to main, or manually from the Actions tab.
#
# The runner pushes code to the instance with rsync rather than having the
# instance pull from GitHub. The Salama-Health org disables deploy keys, and
# this way no GitHub credential ever lives on the server: a compromised box
# cannot read the repository.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Never run two deploys at once; cancel an in progress one if a newer push lands.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code to ship
        uses: actions/checkout@v4

      - name: Set up SSH for the instance
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin the host key instead of disabling strict checking.
          ssh-keyscan -p "${{ secrets.EC2_PORT }}" -H "${{ secrets.EC2_HOST }}" \
            >> ~/.ssh/known_hosts 2>/dev/null

      - name: Sync code to the instance
        env:
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          # --delete keeps the box identical to main, but everything excluded
          # here lives ONLY on the server and must survive a deploy:
          #   .env          secrets (SECRET_KEY, DB password)
          #   models/       ML artifacts, git-ignored, shipped out of band
          #   secrets/      GEE service-account key
          #   nginx/certs/  TLS certificates
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'models/' \
            --exclude 'secrets/' \
            --exclude 'nginx/certs/' \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.EC2_PORT }}" \
            ./ "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${DEPLOY_PATH}/"

      - name: Rebuild and restart containers
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script_stop: true
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            echo "Rebuilding and restarting containers"
            # --remove-orphans: a service deleted from docker-compose.yml is
            # NOT stopped by `up` on its own. Without this, the old nginx
            # container kept holding ports 80/443 and Caddy could not bind.
            docker compose up -d --build --remove-orphans
            echo "Applying database migrations"
            docker compose exec -T api alembic upgrade head || echo "No migrations to apply"
            echo "Cleaning up old images"
            docker image prune -f

      - name: Health check
        # Checks the public HTTPS endpoint, not http://<ip>/health. Caddy
        # serves only the configured hostname and 308-redirects everything
        # else; `curl -fsS` does not follow redirects and only fails on >=400,
        # so the old IP check passed on the redirect alone and would have
        # reported healthy with the API completely down.
        #
        # The hostname is not a secret - it is in the Caddyfile in this repo -
        # and keeping it unmasked makes a failed deploy readable in the log.
        env:
          HEALTH_URL: https://salamahealth.duckdns.org/health
        run: |
          echo "Waiting for the API to report healthy at $HEALTH_URL"
          for i in $(seq 1 20); do
            body=$(curl -fsS --max-time 15 "$HEALTH_URL" 2>/dev/null || true)
            if echo "$body" | grep -q '"status":"ok"'; then
              echo "API is healthy"
              echo "$body"
              exit 0
            fi
            echo "Attempt $i not ready yet, retrying in 6s"
            sleep 6
          done
          echo "API did not become healthy in time"
          exit 1

      - name: Remove the deploy key from the runner
        if: always()
        run: rm -f ~/.ssh/deploy_key
